name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build tests/Looot.Tests -c Release
      - name: Test
        run: dotnet test tests/Looot.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Pack
        run: dotnet pack src/Looot -c Release -o artifacts
      - name: Leak scan
        run: bash scripts/leak-scan.sh .
